apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-fleet-worker.fullname" . }}-headless
  labels:
    {{- include "agent-fleet-worker.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "agent-fleet-worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
