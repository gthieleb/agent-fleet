{{- if not .Values.opencodePassword.secretKeyRef.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-fleet-worker.fullname" . }}
  labels:
    {{- include "agent-fleet-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.opencodePassword.secretKeyRef.key }}: {{ required "opencodePassword.inline must not be empty when no secretKeyRef.name is set" .Values.opencodePassword.inline | quote }}
{{- end }}
