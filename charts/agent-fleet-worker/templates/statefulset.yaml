apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agent-fleet-worker.fullname" . }}
  labels:
    {{- include "agent-fleet-worker.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agent-fleet-worker.fullname" . }}-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "agent-fleet-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-fleet-worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: opencode
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: OPENCODE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-fleet-worker.passwordSecretName" . }}
                  key: {{ .Values.opencodePassword.secretKeyRef.key }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null "http://opencode:${OPENCODE_PASSWORD}@127.0.0.1:{{ .Values.service.port }}/api/info"
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null "http://opencode:${OPENCODE_PASSWORD}@127.0.0.1:{{ .Values.service.port }}/api/info"
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - wget -q -O /dev/null "http://opencode:${OPENCODE_PASSWORD}@127.0.0.1:{{ .Values.service.port }}/api/info"
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/opencode/.local/share/opencode
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
