repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: bunx @biomejs/biome check --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|jsonc)$
        pass_filenames: false
      - id: tflint
        name: tflint
        entry: tflint
        language: system
        files: ^infra/.*\.tf$
        pass_filenames: false
